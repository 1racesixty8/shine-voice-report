services:
  - type: web
    name: shine-voice-report-webhook
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: ATTACH_CALL_RECORDINGS
        value: "true"
      - key: VAPI_MAX_RECORDING_BYTES
        value: 20971520
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: MANAGEMENT_EMAILS
        sync: false
